version: '3.8'

services:
  db:
    image: postgres:15
    container_name: venture27-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: venture27
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: venture27-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
